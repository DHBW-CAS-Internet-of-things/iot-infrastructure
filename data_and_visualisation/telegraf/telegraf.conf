## MQTT Consumer Input
## Values sourced from .env (keep in sync manually):
##   TELEGRAF_MQTT_SERVER=${TELEGRAF_MQTT_SERVER}
##   TELEGRAF_MQTT_TOPICS=${TELEGRAF_MQTT_TOPICS}
##   TELEGRAF_MQTT_USERNAME=${TELEGRAF_MQTT_USERNAME}
##   TELEGRAF_MQTT_PASSWORD=${TELEGRAF_MQTT_PASSWORD}
[[inputs.mqtt_consumer]]
  servers = ["tcp://${TELEGRAF_MQTT_SERVER}"]
  topics = ["${TELEGRAF_MQTT_TOPICS}"]
  username = "${TELEGRAF_MQTT_USERNAME}"
  password = "${TELEGRAF_MQTT_PASSWORD}"
  data_format = "json"

## InfluxDB v2 Output (Token & settings from .env)
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"