services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.ha.address=:8123
      - --entrypoints.influx.address=:8086
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # OPTIONAL dashboard (don’t expose on the internet unless you lock it down):
      # - --api.insecure=true
    ports:
      - "80:80"
      - "8123:8123"
      - "8086:8086"
      # - "8080:8080" # Traefik dashboard if you uncomment the line above
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    environment:
      # Make n8n live under /n8n and generate correct links/webhooks
      N8N_PATH: /n8n
      N8N_EDITOR_BASE_URL: http://${PUBLIC_IP}/n8n
      WEBHOOK_URL: http://${PUBLIC_IP}/n8n/
      # Simple auth for the editor (change these!)
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}
      # Nice-to-have
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
    labels:
      - traefik.enable=true

      # Redirect /n8n (no trailing slash) -> /n8n/
      - traefik.http.routers.n8n-slash.rule=Path(`/n8n`)
      - traefik.http.routers.n8n-slash.entrypoints=web
      - traefik.http.routers.n8n-slash.middlewares=n8n-add-slash
      - traefik.http.middlewares.n8n-add-slash.redirectregex.regex=^/n8n$
      - traefik.http.middlewares.n8n-add-slash.redirectregex.replacement=/n8n/
      - traefik.http.middlewares.n8n-add-slash.redirectregex.permanent=true

      # Serve n8n on /n8n/*
      - traefik.http.routers.n8n.rule=PathPrefix(`/n8n`)
      - traefik.http.routers.n8n.entrypoints=web
      - traefik.http.routers.n8n.middlewares=n8n-strip
      - traefik.http.middlewares.n8n-strip.stripprefix.prefixes=/n8n
      - traefik.http.services.n8n.loadbalancer.server.port=5678
    volumes:
      - ./n8n_data:/home/node/.n8n
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    volumes:
      - "./grafana_data:/var/lib/grafana"
      - "./grafana/provisioning:/etc/grafana/provisioning"
    environment:
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    labels:
      - traefik.enable=true

      # Redirect /grafana -> /grafana/
      - traefik.http.routers.grafana-slash.rule=Path(`/grafana`)
      - traefik.http.routers.grafana-slash.entrypoints=web
      - traefik.http.routers.grafana-slash.middlewares=grafana-add-slash
      - traefik.http.middlewares.grafana-add-slash.redirectregex.regex=^/grafana$
      - traefik.http.middlewares.grafana-add-slash.redirectregex.replacement=/grafana/
      - traefik.http.middlewares.grafana-add-slash.redirectregex.permanent=true

      # Serve Grafana under /grafana/*
      - traefik.http.routers.grafana.rule=PathPrefix(`/grafana`)
      - traefik.http.routers.grafana.entrypoints=web
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    depends_on:
      - influxdb

  influxdb:
    image: influxdb:latest
    container_name: influxdb
    restart: unless-stopped
    volumes:
      - "./influxdb_data:/var/lib/influxdb2"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: ${INFLUXDB_INIT_MODE}
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    labels:
      - traefik.enable=true
      # Serve InfluxDB at the root on the dedicated 'influx' entrypoint (no subpath)
      - traefik.http.routers.influx.rule=PathPrefix(`/`)
      - traefik.http.routers.influx.entrypoints=influx
      - traefik.http.services.influx.loadbalancer.server.port=8086

  telegraf:
    image: telegraf:latest
    container_name: telegraf
    restart: unless-stopped
    depends_on:
      - influxdb
    volumes:
      - "./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro"
    environment:
       TELEGRAF_MQTT_SERVER: ${TELEGRAF_MQTT_SERVER}
       TELEGRAF_MQTT_TOPIC_CLIMATE: ${TELEGRAF_MQTT_TOPIC_CLIMATE}
       TELEGRAF_MQTT_TOPIC_LIGHT: ${TELEGRAF_MQTT_TOPIC_LIGHT}
       TELEGRAF_MQTT_USERNAME: ${TELEGRAF_MQTT_USERNAME}
       TELEGRAF_MQTT_PASSWORD: ${TELEGRAF_MQTT_PASSWORD}
       INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
       INFLUXDB_ORG: ${INFLUXDB_ORG}
       INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    volumes:
      - "./homeassistant_config:/config"
      - "/etc/localtime:/etc/localtime:ro"
    labels:
      - traefik.enable=true
      # Serve HA at the root of the dedicated 'ha' entrypoint (no subpath)
      - traefik.http.routers.ha.rule=PathPrefix(`/`)
      - traefik.http.routers.ha.entrypoints=ha
      - traefik.http.services.ha.loadbalancer.server.port=8123

  # --- Web Audio front-end (Quasar + Nginx) under /audio/ ---
  web-audio:
    build: ./web-audio-interface
    container_name: web-audio
    restart: unless-stopped
    environment:
      - BACKEND_WS_URL='ws://clap-api:8000/ws/stream'
    labels:
      - traefik.enable=true

      # Redirect /audio -> /audio/
      - traefik.http.routers.audio-slash.rule=Path(`/audio`)
      - traefik.http.routers.audio-slash.entrypoints=web
      - traefik.http.routers.audio-slash.middlewares=audio-add-slash
      - traefik.http.middlewares.audio-add-slash.redirectregex.regex=^/audio$
      - traefik.http.middlewares.audio-add-slash.redirectregex.replacement=/audio/
      - traefik.http.middlewares.audio-add-slash.redirectregex.permanent=true

      # Serve the app under /audio/*
      - traefik.http.routers.audio.rule=PathPrefix(`/audio`)
      - traefik.http.routers.audio.entrypoints=web
      - traefik.http.routers.audio.middlewares=audio-strip
      - traefik.http.middlewares.audio-strip.stripprefix.prefixes=/audio
      - traefik.http.services.audio.loadbalancer.server.port=80
    depends_on:
      - clap-api
  
  forwarder:
    depends_on:
      api:
        condition: service_started
    build:
      context: ./clap-recognition-mqtt-forwarder
      args:
        MQTT_HOST: 87.106.168.214
        MQTT_PORT: 1883
        MQTT_USERNAME: casiot
        MQTT_PASSWORD: casiot25
        MQTT_TOPIC: volume/sensor
        API_URL: http://clap-api:8000/predict/volume

  # --- Clap Recognition API under /api/* ---
  clap-api:
    build: ./clap-recognition-api
    container_name: clap-api
    restart: unless-stopped
    labels:
      - traefik.enable=true

      # Route all /api/* traffic here and strip the /api prefix
      - traefik.http.routers.clap-api.rule=PathPrefix(`/api`)
      - traefik.http.routers.clap-api.entrypoints=web
      - traefik.http.routers.clap-api.middlewares=clap-strip
      - traefik.http.middlewares.clap-strip.stripprefix.prefixes=/api
      - traefik.http.services.clap-api.loadbalancer.server.port=8000
