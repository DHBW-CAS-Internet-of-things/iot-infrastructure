version: "3.9"

services:
  traefik:
    image: traefik:v2.11
    command:
      - --entrypoints.web.address=:80
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # OPTIONAL dashboard (don’t expose on the internet unless you lock it down):
      # - --api.insecure=true
    ports:
      - "80:80"
      # - "8080:8080" # Traefik dashboard if you uncomment the line above
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    environment:
      # Make n8n live under /n8n and generate correct links/webhooks
      - N8N_PATH=/n8n
      - N8N_EDITOR_BASE_URL=http://${PUBLIC_IP}/n8n
      - WEBHOOK_URL=http://${PUBLIC_IP}/n8n/
      # Simple auth for the editor (change these!)
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      # Nice-to-have
      - N8N_DIAGNOSTICS_ENABLED=false
    labels:
      - traefik.enable=true

      # Redirect /n8n (no trailing slash) -> /n8n/
      - traefik.http.routers.n8n-slash.rule=Path(`/n8n`)
      - traefik.http.routers.n8n-slash.entrypoints=web
      - traefik.http.routers.n8n-slash.middlewares=n8n-add-slash
      - traefik.http.middlewares.n8n-add-slash.redirectregex.regex=^/n8n$
      - traefik.http.middlewares.n8n-add-slash.redirectregex.replacement=/n8n/
      - traefik.http.middlewares.n8n-add-slash.redirectregex.permanent=true

      # Serve n8n on /n8n/*
      - traefik.http.routers.n8n.rule=PathPrefix(`/n8n`)
      - traefik.http.routers.n8n.entrypoints=web
      - traefik.http.routers.n8n.middlewares=n8n-strip
      - traefik.http.middlewares.n8n-strip.stripprefix.prefixes=/n8n
      - traefik.http.services.n8n.loadbalancer.server.port=5678
    volumes:
      - ./n8n_data:/home/node/.n8n
    restart: unless-stopped
